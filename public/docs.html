<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>API Documentation — Termux Utility Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <style>
    body {
      background: var(--bg, #0f1115);
      color: var(--text, #e2e8f0);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(15, 17, 21, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #38bdf8;
    }
    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Dark mode adjustments for Swagger UI */
    .swagger-ui {
      color: #cbd5e1;
    }
    .swagger-ui .info .title, .swagger-ui .info h2, .swagger-ui .info p {
      color: #f1f5f9;
    }
    .swagger-ui .scheme-container {
      background: #181d26;
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
    }
    .swagger-ui .opblock .opblock-summary-operation-id,
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-path__deprecated {
      color: #f8fafc;
    }
    .swagger-ui .opblock {
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="/">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
      <span>Termux Utility Studio API</span>
    </a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/media">Media Studio</a>
      <a href="/pdf">PDF Studio</a>
      <a href="/image">Image Studio</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/docs" class="active">API Docs</a>
      <a href="/docs/openapi.yaml" download>OpenAPI YAML</a>
    </nav>
  </header>

  <div id="swagger-ui">
    <div id="loading" style="padding: 40px; text-align: center; color: #94a3b8;">
      Loading interactive API documentation...
    </div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" onerror="handleSwaggerLoadError()"></script>
  <script>
    function handleSwaggerLoadError() {
      document.getElementById('swagger-ui').innerHTML = `
        <div style="background: #1e2430; padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-top: 40px;">
          <h2 style="color: #38bdf8; margin-top: 0;">Offline API Documentation</h2>
          <p>The interactive Swagger UI script could not be loaded from CDN (running in offline LAN/Wi-Fi mode).</p>
          <p>You can still view the complete specifications and markdown documentation directly:</p>
          <ul>
            <li><a href="/docs/openapi.yaml" style="color: #38bdf8;" target="_blank">Download OpenAPI 3.1 YAML (docs/openapi.yaml)</a></li>
            <li><a href="/api/analytics/stats" style="color: #38bdf8;" target="_blank">View Live Analytics API (/api/analytics/stats)</a></li>
            <li><a href="/api/health" style="color: #38bdf8;" target="_blank">View System Health API (/api/health)</a></li>
          </ul>
        </div>
      `;
    }

    window.onload = function() {
      if (typeof SwaggerUIBundle !== 'undefined') {
        const ui = SwaggerUIBundle({
          url: "/docs/openapi.yaml",
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIBundle.SwaggerUIStandalonePreset
          ],
          layout: "BaseLayout"
        });
        window.ui = ui;
      }
    };
  </script>
</body>
</html>
