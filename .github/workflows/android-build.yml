name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/app-support
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/*.apk release-apk/AyushServer-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/AyushServer-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-app
          name: "AyushServer Standalone App v1.0.0"
          body: |
            ### 📱 AyushServer Standalone Android APK

            Download and install the APK directly on your Android smartphone:
            * **Embedded Media Engine:** FFmpeg & native tools support
            * **Background Service:** Processing continues even when screen is locked
            * **Direct Phone Storage Access:** Process `/sdcard` videos, images, and documents without cache duplication

            **Download File Below:** `AyushServer-v1.0.0.apk`
          files: release-apk/AyushServer-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
