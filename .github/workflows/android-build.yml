name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Signing Keystore
        run: |
          keytool -list -v -keystore android/app/ayush-release.keystore -storepass ayushserver123 || true

      - name: Build Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace || (echo "Retrying gradle build on transient network error..." && sleep 10 && gradle assembleRelease --no-daemon --stacktrace)

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/AyushServer-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/AyushServer-v1.0.3.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-app
          name: "AyushServer Standalone App v1.0.3"
          body: |
            ### 📱 AyushServer Standalone Android APK v1.0.3

            **Offline Protection & Live Sync:**
            * 🛡️ **Zero Ghost Pages When Server is Off:** App probes server liveness before loading. If Termux server is offline, it immediately renders the "Server Offline" connection screen without showing stale/cached pages.
            * ⚡ **Auto-Reconnection:** As soon as Termux server is started, app auto-detects it within 2 seconds and loads the live studio.
            * 🔄 **Network-Only Document Navigation:** Service worker purged of cached HTML documents so offline requests never show misleading cached mockups.
            * 🖥️ **Full Desktop Site View:** Native 1200px viewport override.
            * 🔍 **Full Page Zoom & Presets:** Smooth real-time scaling (75%, 100%, 125%, 150%).
            * ✍️ **High-Contrast Input Typing:** Crisp visible text on dark theme.

            **Download:** Download `AyushServer-v1.0.3.apk` below.
          files: release-apk/AyushServer-v1.0.3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
