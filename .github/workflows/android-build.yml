name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/app-support
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Signing Keystore
        run: |
          keytool -list -v -keystore android/app/ayush-release.keystore -storepass ayushserver123 || true

      - name: Build Release APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/AyushServer-v1.0.1.apk
          cp release-apk/AyushServer-v1.0.1.apk release-apk/AyushServer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-app
          name: "AyushServer Standalone App v1.0.1"
          body: |
            ### 📱 AyushServer Standalone Android APK v1.0.1

            **Permanent Signing Key Added:** Future updates can now be installed directly over existing versions without package conflicts!

            **Features in this release:**
            * ☰ **App Options Menu:** Three-line toggle menu with smooth bottom sheet controls.
            * 🖥️ **Desktop Site Toggle:** Switch between mobile and desktop layout on the fly.
            * 🔍 **Page Zoom Controls:** Zoom In / Zoom Out and 80%, 100%, 125% quick presets.
            * 📥 **Downloads Manager:** Real-time download tracking, download history, and direct file open/share actions.
            * 📁 **Custom Download Folder:** Set and customize download paths (defaults to `Download/AyushServer`).
            * 🌐 **Server Switcher:** Switch between local Termux server (`127.0.0.1:3000`) or any remote network IP.
            * 🖼️ **Image Studio Fixed:** Native file picker integrated for smooth photo & document uploads.
            * 🔄 **Seamless In-App Updater:** Future app & tool updates install cleanly without uninstalling.

            **Download:** Download `AyushServer-v1.0.1.apk` below.
          files: |
            release-apk/AyushServer-v1.0.1.apk
            release-apk/AyushServer.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
