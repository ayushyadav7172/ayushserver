name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Signing Keystore
        run: |
          keytool -list -v -keystore android/app/ayush-release.keystore -storepass ayushserver123 || true

      - name: Build Release APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/AyushServer-v1.0.05.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/AyushServer-v1.0.05.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.05-app
          name: "AyushServer Standalone App v1.0.05"
          body: |
            ### 📱 AyushServer Standalone Android APK v1.0.05

            **Universal Multi-Server Support & Cleartext Fixes:**
            * 🌐 **Universal Network & Multi-Project Support:** Complete cleartext HTTP traffic unlocked (`usesCleartextTraffic="true"`) for all local IPs (`192.168.*`, `10.*`, `172.*`, localhost) and custom domains.
            * 🔓 **No Proprietary Route Lock:** Removed `/api/health/live` blocking probe. Any project running on any IP and port (Flask, Vite, React, PHP, Node.js, etc.) now loads directly without being falsely flagged offline.
            * ✍️ **High-Contrast Custom URL Inputs:** Fixed invisible text typing in custom URL and download folder dialogs with a high-contrast dark box, cyan border, and crisp white font.
            * 🔒 **Dev SSL Support & Mixed Content:** Enabled self-signed certificate handling and mixed content for development environments.
            * ⚡ **Universal Auto-Reconnect:** Offline recovery now pings the target host universally, automatically reconnecting as soon as the target server is started.
            * 🖥️ **Desktop Site View & Real-Time Zoom:** Native 1200px desktop mode and page scaling presets.

            **Download:** Download `AyushServer-v1.0.05.apk` below.
          files: release-apk/AyushServer-v1.0.05.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
