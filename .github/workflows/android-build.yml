name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Signing Keystore
        run: |
          keytool -list -v -keystore android/app/ayush-release.keystore -storepass ayushserver123 || true

      - name: Build Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace || (echo "Retrying gradle build on transient network error..." && sleep 10 && gradle assembleRelease --no-daemon --stacktrace)

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/AyushServer-v1.0.2.apk
          cp release-apk/AyushServer-v1.0.2.apk release-apk/AyushServer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-app
          name: "AyushServer Standalone App v1.0.2"
          body: |
            ### 📱 AyushServer Standalone Android APK v1.0.2

            **Bug Fixes & UX Enhancements:**
            * 🖥️ **Full Desktop Site Mode:** Native viewport override (1200px width) scaling the full PC layout to phone screen like Chrome.
            * 🔍 **Enhanced Page Zoom:** CSS-powered full-page zoom engine with real-time presets (75%, 100%, 125%, 150%) that zoom images, layouts, and text seamlessly.
            * ✍️ **High-Contrast Visible Input Typing:** Fixed dark theme inputs across the app and login page so typed text is always crisp and visible (no black-on-black or white-on-white text).
            * 🌓 **Algorithmic Darkening Fix:** Disabled WebView algorithmic darkening that previously corrupted dark theme input fields.
            * 🔐 **Signed with Persistent Key:** Automatic 1-click update without package conflict.

            **Download:** Download `AyushServer-v1.0.2.apk` below.
          files: |
            release-apk/AyushServer-v1.0.2.apk
            release-apk/AyushServer.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
