name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Signing Keystore
        run: |
          keytool -list -v -keystore android/app/ayush-release.keystore -storepass ayushserver123 || true

      - name: Build Release APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/*.apk release-apk/AyushServer-v1.0.06.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyushServer-Standalone-APK
          path: release-apk/AyushServer-v1.0.06.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.06-app
          name: "AyushServer Standalone App v1.0.06"
          body: |
            ### 📱 AyushServer Standalone Android APK v1.0.06

            **In-App Experience & True Browser Reload:**
            * 🔄 **Chrome-Style Pull-Down Refresh:** Pulling down to refresh now reloads the active webpage instead of bouncing back to the root homepage.
            * 🌐 **Universal Multi-Project & Any IP Support:** Cleartext HTTP traffic unlocked (`usesCleartextTraffic="true"`) for all local IPs (`192.168.*`, `10.*`, `172.*`, localhost, any port).
            * 🔓 **No Proprietary Route Lock:** Loads any web server/framework (Flask, Vite, React, PHP, Node.js) directly without false offline blocks.
            * ✍️ **High-Contrast Custom URL Inputs:** Sharp white text on dark background with cyan border for custom IP and download folder dialogs.
            * 🔒 **Dev SSL Support & Mixed Content:** Enabled self-signed certificate handling and mixed content for development environments.
            * 🖥️ **Desktop Site View & Real-Time Zoom:** Native 1200px desktop mode and page scaling presets.

            **Download:** Download `AyushServer-v1.0.06.apk` below.
          files: release-apk/AyushServer-v1.0.06.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
